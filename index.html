<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Sistema web de Achados e Perdidos em instituições de ensino. Consulte itens cadastrados, verifique informações detalhadas e acompanhe retiradas de forma segura e organizada." />
    <meta name="keywords" content="achados e perdidos, sistema web, objetos perdidos, instituições de ensino, gerenciamento de itens" />
    <meta name="theme-color" content="#008FD1" />

    <title>Achados & Perdidos</title>
    <link rel="icon" type="image/x-icon" href="/icon.ico" />

    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">

    <style>
      /* Selo da demo (só existe nesta versão de demonstração) */
      #demo-badge {
        position: absolute;
        top: 88px;
        right: 12px;
        left: 12px;
        z-index: 40;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 6px;
        pointer-events: none;
      }
      #demo-badge > * {
        pointer-events: auto;
      }
      #demo-badge a {
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        padding: 7px 14px;
        border-radius: 9999px;
        background: #065f46;
        color: #fff;
        text-decoration: none;
        font: 600 12px/1.3 system-ui, sans-serif;
        box-shadow: 0 4px 14px rgba(6, 95, 70, 0.25);
        transition: background 0.2s, transform 0.2s;
      }
      #demo-badge a:hover {
        background: #047857;
        transform: translateY(-1px);
      }
      #demo-badge .demo-cta {
        color: #a7f3d0;
      }
      #demo-badge .demo-cta b {
        color: #fff;
      }
      #demo-badge button {
        all: unset;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 9999px;
        background: rgba(6, 95, 70, 0.08);
        color: #065f46;
        font: 600 13px/1 system-ui, sans-serif;
      }
      /* Em telas estreitas o selo fica só com o essencial */
      @media (max-width: 640px) {
        #demo-badge {
          top: 76px;
          justify-content: center;
        }
        #demo-badge a {
          font-size: 11px;
          padding: 6px 12px;
        }
        #demo-badge .demo-sep,
        #demo-badge a > span:not(.demo-cta) {
          display: none;
        }
      }
    </style>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="root"></div>

    <!-- Aviso da demo: sem back-end, dados fictícios em memória.
         Também é o atalho para o painel, que de outra forma passa despercebido. -->
    <div id="demo-badge">
      <a href="#/admin-login">
        <strong>Demo</strong>
        <span class="demo-sep">&middot;</span>
        <span>dados fict&iacute;cios</span>
        <span class="demo-sep">&middot;</span>
        <span class="demo-cta">entre com <b>admin / admin</b> e veja o painel &rarr;</span>
      </a>
      <button onclick="document.getElementById('demo-badge').remove()" aria-label="Fechar aviso">&times;</button>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
